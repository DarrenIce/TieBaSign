name: 'Baidu Tieba Auto Sign'

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 0 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:      # 加这个，改完能立刻手动验证，不用等 cron

jobs:
  tieba_sign:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout codes'
        uses: actions/checkout@v7
      - name: 'Set python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 'Install dependencies'
        run: python -m pip install --upgrade requests
      - name: 'Start Sign'
        env:
          BDUSS: ${{ secrets.BDUSS }}
          HOST: ${{ secrets.HOST }}
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          AUTH: ${{ secrets.AUTH }}
        run: python main.py
      - name: Append Success Log
        run: echo "$(date +%Y-%m-%d\ %H:%M:%S) - 签到成功" >> run.log
      - name: Upload log
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: run.log
      - name: Push log
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: auto-checkin
          branch: main
